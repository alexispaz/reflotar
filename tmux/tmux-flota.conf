# tmux-flota.conf -- shared tmux configuration for the AI users.
#
# Installed at /home/agents/etc/tmux-flota.conf (owned by the human) by plan-agentes.py.
# Each AI user's ~/.tmux.conf, written by the planner, is two lines: the colour of its
# bar, then this file:
#     set -g @c colour208
#     source-file /home/agents/etc/tmux-flota.conf
# The colour goes by what the AI user is (claude orange, codex green, a pensadero
# purple), whatever its name, so you always know whose house you are in. Reload: prefix r
#
# Needs tmux 3.2 or newer (the #{user} format, formats inside styles). Sessions start
# a login bash.
#
# Based on the human's usual configuration. Differences from it, and why:
#   - No plugins (tpm, resurrect, continuum, copycat, open, solarized):
#       * tpm clones from GitHub, and the solarized theme is cloned over SSH from
#         gitlab. Agents have no credentials, and running third-party code in each
#         agent user is not a good idea.
#       * resurrect/continuum would fight `flota arrancar` and coord, which rebuild
#         the fleet (and relaunch each claude with its --resume).
#       * copycat: tmux's built-in search does the same (prefix Esc, then / or ?).
#   - No C-x bound to send-prefix: there is no nesting, and a -n binding steals
#     C-x from bash (C-x C-e) and from any program in the pane.
#   - No version checks with bc: tmux 3.2 or newer is a requirement (above).
#   - Pane borders carry the name of the session or agent (fleet's @repo option).
#   - A window where an agent rang the bell (it needs you) is marked in the bar.
#   - Longer history (Claude Code's output is long) and a short status bar that fits
#     a narrow terminal.

# ---- base -------------------------------------------------------------------------
set -g default-command "bash -l"          # login: loads .profile (umask 002, /home/agents/bin)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -g history-limit 50000
set -g mouse on                           # scroll and select panes with the mouse or a touch screen
set -g set-clipboard on                   # copy with OSC 52 towards the local terminal, if it supports it
set -g base-index 1
set -g display-time 5000
set -g repeat-time 1000
set -g status-keys vi
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#{user}@#h #S:#W"
setw -g automatic-rename on               # fleet turns it off per window when it names one
# A window is named after its session: Claude Code titles the pane "✳ <session>" (another
# glyph while it works), so the name is the title without its first word. A claude
# started without -n titles the pane with its conversation's topic, which has spaces
# and changes; a program that sets no title (codex, a shell) leaves the host there. In
# both cases the window takes its folder's name (~/coord, ~/work/rc, ~/maestro), so
# `claude` alone in ~/maestro shows "maestro". A window you rename keeps it.
setw -g automatic-rename-format '#{?#{||:#{==:#{pane_title},#{host}},#{m:* *,#{s/^[^ ]* //:pane_title}}},#{b:pane_current_path},#{s/^[^ ]* //:pane_title}}'

# ---- prefix: C-a, as in the original ------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---- copy as in vim (original) -------------------------------------------------
setw -g mode-keys vi
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ---- windows and panes (original) --------------------------------------------
unbind S-Up
unbind S-Down
unbind S-Left
unbind S-Right
bind -n S-Right next-window
bind -n S-Left  previous-window

unbind Up
unbind Down
unbind Left
unbind Right
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind m command-prompt -p "move window to:" "swap-window -t '%%'"
bind o move-window -r                                   # renumber windows in order
bind j command-prompt -p "send pane to:"   "join-pane -t '%%'"

# ---- fleet ---------------------------------------------------------------------
# Every pane shows which session it is on its top border: fleet's @repo if set,
# otherwise the program running in it. With several agents in one window, you can
# tell who is who without reading the content.
set -g pane-border-status top
set -g pane-border-format " #{?@repo,#[bold]#{@repo}#[nobold],#{pane_current_command}} #{?@fleet,(#{@fleet}) ,}"

# When an agent rings the bell (it finished, or is waiting for you), its window is
# marked in the bar. Nothing is interrupted and no noise is made.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Jump to the next window that asked for attention (bell).
bind B next-window -a

# ---- colours: one per AI user ----------------------------------------------------
# @c comes from ~/.tmux.conf (above); a user it does not set is grey.
if -F "#{==:#{@c},}" "set -g @c colour244"

set -g status-style "bg=colour235,fg=colour250"
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 20
set -g status-left  "#[fg=colour235,bg=#{@c},bold] #{user} #[default] "
set -g status-right "#[fg=colour136]%d/%m #[fg=#{@c},bold]%H:%M "

setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[fg=colour235,bg=#{@c},bold] #I #W "
setw -g window-status-bell-style     "fg=colour235,bg=colour160,bold"

set -g pane-border-style        "fg=colour240"
set -g pane-active-border-style "fg=#{@c}"
set -g message-style            "bg=#{@c},fg=colour235"
set -g mode-style               "bg=colour238,fg=colour230"
